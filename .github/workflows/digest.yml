name: News Digest

on:
  schedule:
    # Every hour UTC; script gating ensures it only acts at 8/11/15/18 ET
    - cron: '0 * * * *'
  workflow_dispatch:       # manual test run from GitHub UI

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore saved digests from gh-pages
        run: |
          git fetch origin gh-pages --depth=1 || true
          git checkout origin/gh-pages -- _data 2>/dev/null || echo "No saved digests yet"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest and send to Telegram + Email
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python digest.py

      - name: Build static HTML page
        run: python build_page.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false

      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
